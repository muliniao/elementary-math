<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
    <!-- 底部直线段 ABCD -->
    <line x1="30" y1="120" x2="240" y2="120" stroke="#333333" stroke-width="2"/>
    <!-- 上翘的线段 DE（45度） -->
    <line x1="240" y1="120" x2="310" y2="50" stroke="#333333" stroke-width="2"/>
    <!-- 端点标记 -->
    <circle cx="30" cy="120" r="4" fill="#333333"/>
    <circle cx="100" cy="120" r="4" fill="#333333"/>
    <circle cx="170" cy="120" r="4" fill="#333333"/>
    <circle cx="240" cy="120" r="4" fill="#333333"/>
    <circle cx="310" cy="50" r="4" fill="#333333"/>
    <!-- 标签 -->
    <text x="20" y="150" font-size="14" fill="#222222">A</text>
    <text x="95" y="150" font-size="14" fill="#222222">B</text>
    <text x="165" y="150" font-size="14" fill="#222222">C</text>
    <text x="235" y="150" font-size="14" fill="#222222">D</text>
    <text x="305" y="70" font-size="14" fill="#222222">E</text>
</svg>
