<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 一条直线 -->
    <line x1="40" y1="50" x2="320" y2="50" stroke="#333333" stroke-width="2"/>
    <!-- 5个等距端点标记 -->
    <circle cx="40" cy="50" r="4" fill="#333333"/>
    <circle cx="110" cy="50" r="4" fill="#333333"/>
    <circle cx="180" cy="50" r="4" fill="#333333"/>
    <circle cx="250" cy="50" r="4" fill="#333333"/>
    <circle cx="320" cy="50" r="4" fill="#333333"/>
    <!-- 标签 -->
    <text x="32" y="75" font-size="14" fill="#222222">A</text>
    <text x="105" y="75" font-size="14" fill="#222222">B</text>
    <text x="175" y="75" font-size="14" fill="#222222">C</text>
    <text x="245" y="75" font-size="14" fill="#222222">D</text>
    <text x="315" y="75" font-size="14" fill="#222222">E</text>
</svg>
